<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover libera o env(safe-area-inset-*) usado no CSS: sem ele,
         no iPhone com notch o conteudo fica por baixo da barra e do indicador. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex" />

    <!-- %STORE_NAME% e trocado no build pelo VITE_STORE_NAME (ver vite.config.ts).
         Nao ha tags og:/twitter: aqui: isto e um painel interno, ninguem
         compartilha o link, e elas so davam mais um lugar para a marca ficar
         escrita no codigo. -->
    <title>%STORE_NAME% — Atendimento</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
