# =============================================================================
# Mi Piace — variante para o Easypanel (Hostinger ou qualquer VPS).
#
# Use este arquivo, e não o docker-compose.yml, ao criar um serviço do tipo
# "Compose" apontando para o repositório. O Easypanel roda
# `docker compose up --build -d` e interpola ${VAR} a partir das variáveis que
# você preenche no editor de ambiente dele.
#
# O que muda em relação ao docker-compose.yml local, e por quê:
#
#   * sem `container_name` — o Easypanel roda vários projetos no mesmo Docker;
#     nome fixo colide com outro projeto e ele avisa sobre isso.
#   * sem `ports` publicadas — quem expõe para a internet é o Traefik do
#     Easypanel, configurado na aba Domains. Porta publicada aqui fura o proxy
#     e precisa ser única no servidor inteiro.
#   * sem `profiles` — o Easypanel não passa `--profile`, então um serviço
#     atrás de profile simplesmente nunca subiria. Aqui a Evolution API é parte
#     da stack.
#   * sem Caddy e sem o túnel Cloudflare — o Traefik do Easypanel já termina o
#     TLS e emite o certificado. Eram as duas peças que existiam só para dar
#     HTTPS e um endereço público.
#   * sem Supabase Studio/pg-meta — administrador de banco sem senha própria
#     não vale o risco num servidor público. Para olhar o banco, use o terminal
#     do Easypanel: `psql -U postgres`.
#
# Domínios a configurar na interface, depois do primeiro deploy:
#
#   frontend : porta 8080  -> https://<seu-dominio>
#   backend  : porta 8000  -> https://api.<seu-dominio>
#
# E então PUBLIC_BASE_URL/VITE_API_BASE_URL apontam para o domínio do backend.
# =============================================================================

services:
  db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:-V3/naZU8lmW74bdckxAaQrleNOnSJZ9kSCuB0vhP}
    command:
      [
        "postgres",
        "-c", "config_file=/etc/postgresql/postgresql.conf",
        "-c", "log_min_messages=fatal",
      ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Aplicados só no primeiro boot do volume, em ordem alfabética.
      - ./back/db/schema.sql:/docker-entrypoint-initdb.d/init-scripts/01-schema.sql:ro
      - ./back/db/seed.sql:/docker-entrypoint-initdb.d/init-scripts/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./back
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      ENVIRONMENT: production
      DEBUG: "false"
      FAKE_MODE: "false"
      # Domínio público do backend — é daqui que sai a notification_url do Pix.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DELIVERY_FEE: ${DELIVERY_FEE:-5.00}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-mipiace}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET}
    restart: unless-stopped

  frontend:
    build:
      context: ./front
      args:
        # O Vite embute isto no bundle em tempo de build: mudar depois exige
        # redeploy, não basta reiniciar. A chave fica visível no navegador.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WhatsApp. Não precisa de domínio público: o backend fala com ela pela rede
  # interna. Para parear o QR, dê um domínio temporário ao manager ou use o
  # terminal do Easypanel — ver DEPLOY.md, seção do Easypanel.
  # ---------------------------------------------------------------------------
  evolution-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-evolution}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  evolution-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD:-evolution}@evolution-db:5432/evolution?schema=evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend:8000/webhooks/evolution?token=${EVOLUTION_WEBHOOK_TOKEN}
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped

volumes:
  pgdata:
  evolution_pgdata:
  evolution_redis_data:
  evolution_instances:
